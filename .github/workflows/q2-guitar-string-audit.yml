name: Q2 recorded guitar string-zone consistency — evidence gate

on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_guitar_strings_q2.py'
      - 'tests/test_guitar_strings_q2.py'
      - 'studio7/string_mapping.py'
      - 'tests/test_string_mapping_q2.py'
      - 'tools/compare_guitar_strings_q2.py'
      - 'studio7/render.py'
      - 'studio7/samples.py'
      - 'studio7/articulation.py'
      - 'demo_v7.py'
      - '.github/workflows/q2-guitar-string-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guitar-source-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline DSP environment
        run: python -m pip install -r requirements.txt
      - name: Test string label parsing and isolated guitar gesture grouping
        run: python -m unittest tests.test_guitar_strings_q2 tests.test_string_mapping_q2 -v
      - name: Fetch original licensed source files for actual physical string mapping
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .q2-downloads
          gh release download meta-steel-guitar-v1.0.0 --repo facebookincubator/Meta-open-sound --pattern 'meta-open-sound-meta-steel-guitar-ogg.zip' --dir .q2-downloads
          gh release download meta-nylon-guitar-v1.0.0 --repo facebookincubator/Meta-open-sound --pattern 'meta-open-sound-meta-nylon-guitar-ogg.zip' --dir .q2-downloads
      - name: Verify publisher archive and unpack only audited steel and nylon samples
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.install_cc0 import install_pack
          from tools.install_optional_v7 import install_nylon
          root=Path('assets/q2')
          root.mkdir(parents=True,exist_ok=True)
          print(install_pack('meta-steel-guitar',Path('.q2-downloads/meta-open-sound-meta-steel-guitar-ogg.zip'),root))
          install_nylon(Path('.q2-downloads/meta-open-sound-meta-nylon-guitar-ogg.zip'),root)
          PY
      - name: Audit original Harbor and Silver string assignments without changing playback
        run: |
          python -m tools.audit_guitar_strings_q2 --assets assets/q2 --out q2-reports/legacy_guitar_string_assignments.json
      - name: Verify source-map candidate does not double-assign physical chord strings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('q2-reports/legacy_guitar_string_assignments.json').read_text())
          assert report['harbor']['gestures_with_duplicate_strings']==24
          assert report['silver']['gestures_with_duplicate_strings']==2
          for style in ('harbor','silver'):
              candidate=report[style]['candidate_with_playable_bm_revoicing']
              assert candidate['remaining_intra_strum_string_conflicts']==0
              assert candidate['unmapped_strums']==0
              assert candidate['mapped_distinct_strums']==report[style]['gestures']
          assert report['harbor']['guitar_voicing_change']['chords_revoiced']==8
          print('Every existing acoustic guitar chord has a distinct physical string map')
          PY
      - name: Render actual steel/nylon guitar only at controlled matched loudness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m tools.compare_guitar_strings_q2 --assets assets/q2 --style harbor --out q2-previews/harbor
          python -m tools.compare_guitar_strings_q2 --assets assets/q2 --style silver --out q2-previews/silver
          ffmpeg -v error -xerror -i q2-previews/harbor/Q2_harbor_strings_after.mp3 -f null -
          ffmpeg -v error -xerror -i q2-previews/silver/Q2_silver_strings_after.mp3 -f null -
          python - <<'PY'
          import json
          from pathlib import Path
          for style in ('harbor','silver'):
              result=json.loads((Path('q2-previews')/style/f'Q2_{style}_strings_report.json').read_text())
              assert result['rms_level_difference_db']<=.12
              assert result['source_difference_rms']>0
          print('Level-matched recorded guitar comparison verified')
          PY
      - name: Preserve technical source mapping, not publisher recording bytes
        uses: actions/upload-artifact@v4
        with:
          name: Q2-Guitar-Legacy-Physical-String-Audit
          path: |
            q2-reports/legacy_guitar_string_assignments.json
            q2-previews/harbor/*.mp3
            q2-previews/harbor/*report.json
            q2-previews/silver/*.mp3
            q2-previews/silver/*report.json
          retention-days: 90
