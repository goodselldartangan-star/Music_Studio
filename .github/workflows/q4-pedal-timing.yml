name: Q4 piano note-off timing — scoped pedal windows and real-audio QA

on:
  push:
    branches: [main]
    paths:
      - 'studio7/pedal_timing.py'
      - 'studio7/render.py'
      - 'demo_v7.py'
      - 'tests/test_pedal_timing_q4.py'
      - 'tools/compare_pedal_q4.py'
      - '.github/workflows/q4-pedal-timing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  piano-pedal-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline piano renderer and soundfont
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y libfluidsynth3 timgm6mb-soundfont ffmpeg
      - name: Pedal note-off intervals and earlier polyphony regressions
        run: |
          python -m unittest tests.test_pedal_timing_q4 tests.test_piano_performance_p2 tests.test_articulation tests.test_stereo_wav_q3 -v
      - name: Compare piano note-off behavior with untouched dry intro
        run: |
          python -m tools.compare_pedal_q4 --gm /usr/share/sounds/sf2/TimGM6mb.sf2 --out q4-pedal-preview
          ffmpeg -v error -xerror -i q4-pedal-preview/Q4_pedal_before.mp3 -f null -
          ffmpeg -v error -xerror -i q4-pedal-preview/Q4_pedal_after.mp3 -f null -
      - name: Verify integrated Silver optional MP3 only
        run: |
          python demo_v7.py --gm /usr/share/sounds/sf2/TimGM6mb.sf2 --style silver --piano-pedal-timing --out q4-integrated
          test -f q4-integrated/silver-v7-q4-pedal-timing.mp3
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('q4-integrated/verification_v7.json').read_text())[0]
          assert r['audio_qa']['passed']
          assert r['metadata']['piano_pedal_timing']['piano_notes_held_past_key_release']>0
          assert r['metadata']['piano_pedal_timing']['true_pedal_mechanism_or_string_resonance'] is False
          PY
      - name: Archive controlled comparisons only
        uses: actions/upload-artifact@v4
        with:
          name: Q4-Piano-NoteOff-Timing-Comparison
          path: |
            q4-pedal-preview/Q4_pedal_*.mp3
            q4-pedal-preview/Q4_pedal_timing_report.json
            q4-integrated/verification_v7.json
          retention-days: 90

  publisher-meta-piano:
    needs: piano-pedal-timing
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install normal local audio readers
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download one official pinned CC0 piano archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .q4-archive
          gh release download meta-piano-v1.0.0 --repo facebookincubator/Meta-open-sound --pattern 'meta-open-sound-meta-piano-ogg.zip' --dir .q4-archive
      - name: Verify original license, SHA256 and 352 real recordings
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.install_cc0 import install_pack
          result=install_pack('meta-piano',Path('.q4-archive/meta-open-sound-meta-piano-ogg.zip'),Path('assets/q4-piano'))
          assert result['files']==352
          assert result['license']=='CC0-1.0'
          print(result)
          PY
      - name: Compare same released upright-piano samples with and without note-off deferral
        run: |
          python -m tools.compare_pedal_q4 --piano-assets assets/q4-piano --out q4-meta-preview
          ffmpeg -v error -xerror -i q4-meta-preview/Q4_pedal_before.mp3 -f null -
          ffmpeg -v error -xerror -i q4-meta-preview/Q4_pedal_after.mp3 -f null -
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('q4-meta-preview/Q4_pedal_timing_report.json').read_text())
          assert report['backend']=='publisher Meta Piano OGG'
          assert report['initial_audio_difference_rms']==0
          assert report['entire_audio_difference_rms']>0
          assert report['piano_performance']['piano_notes_held_past_key_release']==32
          assert abs(report['excerpt_rms_difference_db'])<=.6
          PY
      - name: Preserve short technical comparisons only
        uses: actions/upload-artifact@v4
        with:
          name: Q4-Real-Meta-Piano-Pedal-Timing-AB
          path: |
            q4-meta-preview/Q4_pedal_*.mp3
            q4-meta-preview/Q4_pedal_timing_report.json
          retention-days: 90
