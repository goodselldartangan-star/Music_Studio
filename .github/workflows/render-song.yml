name: Music Studio - gated tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Validate songwriting plans, provider contract, and audio QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify required audio tools
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Run deterministic offline tests (no provider credits)
        run: python -m unittest discover -s tests -v
      - name: Validate original example composition
        run: python music_studio.py validate-plan examples/the_last_ferry_bell.json
      - name: Validate music API request without submitting it
        run: python music_studio.py render examples/the_last_ferry_bell.json --dry-run > /tmp/song-dry-run.json
      - name: Keep recordings and private reference tracks out of source control
        run: |
          if git ls-files | grep -E '\.(mp3|wav|flac|mid)$'; then
            echo 'Error: a song or reference recording was checked in.' >&2
            exit 1
          fi

  remove-old-song-assets:
    name: Remove only old released song media
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove old audio and MIDI only; leave code, score, release intact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for name in Afterglow_Atlas.mp3 Afterglow_Atlas.wav Afterglow_Atlas.mid; do
            if gh release view afterglow-atlas-v1 --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release delete-asset afterglow-atlas-v1 "$name" --yes
              echo "Removed released song asset: $name"
            fi
          done
