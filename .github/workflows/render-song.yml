name: Render original song

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "requirements.txt"
      - ".github/workflows/render-song.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-test:
    name: Render WAV, MP3, MIDI and verify mix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
      - name: Extract reviewed source
        run: unzip -o source/Music_Studio_Source.zip
      - name: Render original composition and MIDI
        run: python afterglow_atlas.py --out output
      - name: Run audio engineering tests
        run: python test_audio.py
      - name: Export listening master
        run: |
          ffmpeg -hide_banner -y -loglevel error -i output/Afterglow_Atlas.wav             -metadata title="Afterglow Atlas"             -metadata artist="Music Studio (original composition)"             -codec:a libmp3lame -b:a 320k output/Afterglow_Atlas.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 output/Afterglow_Atlas.mp3
      - name: Upload complete studio masters
        uses: actions/upload-artifact@v4
        with:
          name: Afterglow-Atlas-Final-Song
          path: |
            output/Afterglow_Atlas.mp3
            output/Afterglow_Atlas.wav
            output/Afterglow_Atlas.mid
            output/Afterglow_Atlas.score.json
          retention-days: 90
      - name: Publish versioned track release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view afterglow-atlas-v1 > /dev/null 2>&1 ||             gh release create afterglow-atlas-v1               --title "Afterglow Atlas — Original Instrumental"               --notes "Original 116 BPM cinematic electronic instrumental, rendered from the reproducible Music Studio source. 2:34 stereo 24-bit WAV, 320 kbps MP3, MIDI and score. Automated DSP checks passed; final aesthetic judgment is for listeners."
          gh release upload afterglow-atlas-v1             output/Afterglow_Atlas.mp3             output/Afterglow_Atlas.wav             output/Afterglow_Atlas.mid             output/Afterglow_Atlas.score.json             --clobber
