name: Music Studio v2 - test, synthesize and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Offline songwriting and DSP tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline requirements
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg/FFprobe for audio tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
          ffmpeg -version | head -1
      - name: Test existing and v2 composition tools
        run: python -m unittest discover -s tests -v
      - name: Check full score and MIDI without rendering audio
        run: python studio_v2.py --score-only --out score_only
      - name: Check alternative tempo/key controls
        run: python studio_v2.py --score-only --bpm 103 --transpose -3 --seed 4321 --out alt_score
      - name: Never check in audio reference files or generated tracks
        run: |
          if git ls-files | grep -E '\.(mp3|wav|flac|mid)$'; then
            echo 'Rendered music and private references must not be checked in' >&2
            exit 1
          fi

  render-and-verify:
    name: Produce v2 track and pass every audio quality gate
    needs: unit-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline DSP requirements
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg/FFprobe for audio rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
          ffmpeg -version | head -1
      - name: Preview test without external AI
        run: |
          python studio_v2.py --preview-bars 8 --out preview
          python quality_v2.py preview --preview
      - name: Render full instrumental locally
        run: python studio_v2.py --out output_v2
      - name: Gate release on full audio quality tests
        run: python quality_v2.py output_v2
      - name: Publish passing master as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Porchlight-Receiver-Studio-v2
          path: |
            output_v2/Porchlight_Receiver.mp3
            output_v2/Porchlight_Receiver.wav
            output_v2/Porchlight_Receiver.mid
            output_v2/Porchlight_Receiver.score.json
            output_v2/quality_v2.json
          retention-days: 90
      - name: Publish separate v2 release after all tests
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view porchlight-receiver-v2 > /dev/null 2>&1 || \
            gh release create porchlight-receiver-v2 \
              --title 'Porchlight Receiver - Music Studio v2' \
              --notes 'Original 3:09 offline instrumental with physical-model strings, expressive groove, controlled buses and FFmpeg true-peak/loudness QA. Only ChatGPT authored the composition and code; no outside AI, keys or samples. Tests are technical and do not replace critical listening.'
          gh release upload porchlight-receiver-v2 \
            output_v2/Porchlight_Receiver.mp3 \
            output_v2/Porchlight_Receiver.wav \
            output_v2/Porchlight_Receiver.mid \
            output_v2/Porchlight_Receiver.score.json \
            output_v2/quality_v2.json --clobber