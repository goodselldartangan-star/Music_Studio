name: Music Studio v3 — modular offline build

on:
  push:
    branches: [main]
    paths:
      - 'studio3/**'
      - 'render.py'
      - 'check.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/music-studio-v3.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Unit tests, 8-bar preview, media integrity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Install FFmpeg and soundfile runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
          ffmpeg -version | head -1
      - run: python -m unittest discover -s tests -v
      - run: python render.py --bpm 105 --transpose -2 --seed 42 --preview-bars 8 --score-only --out alt_score
      - run: python render.py --preview-bars 8 --out preview
      - run: python check.py preview --preview
      - name: No generated media or references committed
        run: |
          if git ls-files | grep -E '\.(mp3|wav|flac|mid)$'; then
            echo 'Audio belongs in release assets, never source control' >&2
            exit 1
          fi

  publish:
    name: Render, verify, and publish Blue Hour Signal
    if: github.event_name != 'pull_request'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Install FFmpeg and soundfile runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
          ffmpeg -version | head -1
      - run: python render.py --out output
      - run: python check.py output
      - name: Preserve audited masters
        uses: actions/upload-artifact@v4
        with:
          name: Blue-Hour-Signal-v3
          path: |
            output/Blue_Hour_Signal.mp3
            output/Blue_Hour_Signal.wav
            output/Blue_Hour_Signal.mid
            output/Blue_Hour_Signal.score.json
            output/qa_report.json
          retention-days: 90
      - name: Publish after QA
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view blue-hour-signal-v3 > /dev/null 2>&1 || \
            gh release create blue-hour-signal-v3 \
              --title 'Blue Hour Signal — original offline instrumental' \
              --notes 'Original 3:34 indie-electronic song. Built by modular code with no external AI/API. Includes passing QA report. Technical tests are not a subjective listening assessment.'
          gh release upload blue-hour-signal-v3 \
            output/Blue_Hour_Signal.mp3 \
            output/Blue_Hour_Signal.wav \
            output/Blue_Hour_Signal.mid \
            output/Blue_Hour_Signal.score.json \
            output/qa_report.json --clobber
