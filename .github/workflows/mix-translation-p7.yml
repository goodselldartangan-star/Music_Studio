name: P7 mix translation — low side, true peak and mono QA

on:
  push:
    branches: [main]
    paths:
      - 'studio7/mix_translation.py'
      - 'studio7/render.py'
      - 'demo_v7.py'
      - 'tests/test_mix_translation_p7.py'
      - 'tools/compare_mix_p7.py'
      - '.github/workflows/mix-translation-p7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mix-translation:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install non-AI audio engine, GM fixture and decoder
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libfluidsynth3 timgm6mb-soundfont
      - name: Test low band side translation, center preservation, peaks and existing quality
        run: |
          python -m unittest tests.test_mix_translation_p7 tests.test_effects_p6 tests.test_studio7 -v
      - name: Render P7 full same-source mix comparison and check MP3 decoding
        run: |
          python -m tools.compare_mix_p7 --gm /usr/share/sounds/sf2/TimGM6mb.sf2 --out p7-mix-preview
          ffmpeg -v error -xerror -i p7-mix-preview/P7_mono_before.mp3 -f null -
          ffmpeg -v error -xerror -i p7-mix-preview/P7_mono_after.mp3 -f null -
      - name: Verify optional precise mono inside complete MP3 render
        run: |
          python demo_v7.py --gm /usr/share/sounds/sf2/TimGM6mb.sf2 --style after --precise-low-mono --out p7-integrated
          test -f p7-integrated/after-v7-p7-mono.mp3
          test -f p7-integrated/verification_v7.json
      - name: Archive objective P7 mix evidence
        uses: actions/upload-artifact@v4
        with:
          name: P7-Technical-Mix-Translation
          path: |
            p7-mix-preview/P7_mono_*.mp3
            p7-mix-preview/P7_mono_report.json
            p7-integrated/verification_v7.json
          retention-days: 90
