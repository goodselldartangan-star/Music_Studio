name: Music Studio v7 — musical compatibility and effects demos
on:
  push:
    branches: [main]
    paths:
      - 'studio7/**'
      - 'tests/test_studio7.py'
      - 'tests/test_effects_p6.py'
      - 'tests/test_mix_translation_p7.py'
      - 'tests/test_mix_stems_p7.py'
      - 'tools/audit_mix_stems_p7.py'
      - 'tools/install_optional_v7.py'
      - 'tools/audit_sample_coverage.py'
      - 'tests/test_sample_coverage.py'
      - 'demo_v7.py'
      - '.github/workflows/music-studio-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  music-theory-and-dsp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline dependencies, no AI access
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y libfluidsynth3 ffmpeg
      - name: Score, registers, harmony, effects, MIDI and compatibility tests
        run: python -m unittest discover -s tests -v
      - name: Review every original score before generating paid or long audio
        run: |
          python - <<'PY'
          from studio7.score import make, SONGS
          from studio7.audit import review
          for style in SONGS:
              report=review(make(style))
              print(style, report)
              assert report['passed']
          PY
  recorded-instrument-demos:
    needs: music-theory-and-dsp-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local non-AI render and package tools
        run: |
          python -m pip install -r requirements.txt py7zr imageio-ffmpeg
          sudo apt-get update -qq
          sudo apt-get install -y libfluidsynth3 ffmpeg libsndfile1
          ffprobe -version | head -1
      - name: Download real guitars, piano, bass and kit from their original publishers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .v7-archives
          gh release download meta-steel-guitar-v1.0.0 --repo facebookincubator/Meta-open-sound --pattern 'meta-open-sound-meta-steel-guitar-ogg.zip' --dir .v7-archives
          gh release download meta-piano-v1.0.0 --repo facebookincubator/Meta-open-sound --pattern 'meta-open-sound-meta-piano-ogg.zip' --dir .v7-archives
          gh release download meta-nylon-guitar-v1.0.0 --repo facebookincubator/Meta-open-sound --pattern 'meta-open-sound-meta-nylon-guitar-ogg.zip' --dir .v7-archives
          gh release download 2026-08-07 --repo freepats/electric-guitar-FSBS-clean --pattern 'EGuitarFSBS-clean-bridge-small-SF2-20260807.7z' --dir .v7-archives
          gh release download 2019-09-30 --repo freepats/electric-bass-YR --pattern 'FingerBassYR-SF2-20190930.7z' --dir .v7-archives
          gh release download 2019-09-30 --repo freepats/electric-bass-YR --pattern 'PickedBassYR-SF2-20190930.7z' --dir .v7-archives
          gh release download 2020-10-18 --repo freepats/muldjordkit --pattern 'MuldjordKit-SF2-20201018.7z' --dir .v7-archives
      - name: Unpack provenance-tracked original sampled instruments
        run: |
          python tools/install_cc0.py --no-download --guitar-zip .v7-archives/meta-open-sound-meta-steel-guitar-ogg.zip --piano-zip .v7-archives/meta-open-sound-meta-piano-ogg.zip --out assets/v7
          python tools/install_soundfonts.py --archives .v7-archives --out assets/v7
          python tools/install_optional_v7.py --picked-bass .v7-archives/PickedBassYR-SF2-20190930.7z --nylon .v7-archives/meta-open-sound-meta-nylon-guitar-ogg.zip --out assets/v7
      - name: Audit actual recorded sample pitches and velocity layers
        run: python -m tools.audit_sample_coverage --assets assets/v7 --out v7-demos/sample_coverage_p1.json
      - name: Render three independent originals with selective effects
        run: python demo_v7.py --assets assets/v7 --out v7-demos
      - name: Verify decoded MP3 properties and real-sample backend
        run: |
          python - <<'PY'
          import json,pathlib
          base=pathlib.Path('v7-demos')
          report=json.loads((base/'verification_v7.json').read_text())
          assert len(report)==3
          for result in report:
              assert result['metadata']['backend']=='recorded instruments'
              assert result['audio_qa']['passed']
              assert result['metadata']['effects_enabled']
          assert (pathlib.Path('assets/v7')/'optional_v7_provenance.json').exists()
          print('All three independently verified recorded-sample masters passed.')
          PY
      - name: Verify P2 playing technique on actual recorded instruments
        run: |
          python demo_v7.py --assets assets/v7 --style harbor --guitar-performance --bass-performance --piano-performance --out v7-p2-harbor
          python demo_v7.py --assets assets/v7 --style silver --guitar-performance --bass-performance --piano-performance --out v7-p2-silver
          python - <<'PY'
          import json,pathlib
          for style in ('harbor','silver'):
              folder=pathlib.Path(f'v7-p2-{style}')
              result=json.loads((folder/'verification_v7.json').read_text())[0]
              meta=result['metadata']
              assert meta['backend']=='recorded instruments'
              assert result['audio_qa']['passed']
              assert meta['guitar_performance'] is not None
              assert meta['bass_performance'] is not None
              assert meta['piano_performance'] is not None
              assert (folder/f'{style}-v7-p2-guitar-p2-bass-p2-piano.mp3').is_file()
              print(style, {part:meta[f'{part}_performance'] for part in ('guitar','bass','piano')})
          PY
      - name: Verify optional P3 bass/kick pocket on recorded-instrument sample backends
        run: |
          python demo_v7.py --assets assets/v7 --style after --rhythm-pocket --out v7-p3-after
          python - <<'PY'
          import json,pathlib
          folder=pathlib.Path('v7-p3-after')
          r=json.loads((folder/'verification_v7.json').read_text())[0]
          meta=r['metadata']
          assert meta['backend']=='recorded instruments'
          assert meta['rhythm_pocket'] and meta['rhythm_pocket']['bass_anchors_moved']>0
          assert meta['rhythm_pocket']['median_lag_after_ms']<meta['rhythm_pocket']['median_lag_before_ms']
          assert r['audio_qa']['passed']
          assert (folder/'after-v7-p3-pocket.mp3').is_file()
          print('P3 real-sample timing experiment verified; listener preference untested')
          PY
      - name: Verify optional P3 drum dynamics and pocket together on recorded instruments
        run: |
          python demo_v7.py --assets assets/v7 --style after --rhythm-pocket --drum-dynamics --out v7-p3-drum-after
          python - <<'PY'
          import json,pathlib
          folder=pathlib.Path('v7-p3-drum-after')
          result=json.loads((folder/'verification_v7.json').read_text())[0]
          meta=result['metadata']
          assert meta['backend']=='recorded instruments'
          assert meta['rhythm_pocket']['bass_anchors_moved']>0
          assert meta['drum_dynamics']['changed']>0
          assert result['audio_qa']['passed']
          assert (folder/'after-v7-p3-pocket-p3-drums.mp3').is_file()
          print('P3 recorded-kit playback and optional timing both verified')
          PY
      - name: Verify optional P4 register separation with recorded piano and lead
        run: |
          python demo_v7.py --assets assets/v7 --style silver --register-separation --out v7-p4-silver
          python - <<'PY'
          import json,pathlib
          folder=pathlib.Path('v7-p4-silver')
          report=json.loads((folder/'verification_v7.json').read_text())[0]
          m=report['metadata']
          assert m['backend']=='recorded instruments'
          assert m['register_separation']['unisons_after']<m['register_separation']['unisons_before']
          assert m['register_separation']['semitones_after']<=m['register_separation']['semitones_before']
          assert report['audio_qa']['passed']
          assert (folder/'silver-v7-p4-register.mp3').is_file()
          print('P4 sample-backed octave revoicing technical acceptance passed')
          PY
      - name: Verify P5 optional final motif with real lead and accompaniment samples
        run: |
          python demo_v7.py --assets assets/v7 --style after --melody-answer --out v7-p5-after
          python - <<'PY'
          import json,pathlib
          folder=pathlib.Path('v7-p5-after')
          item=json.loads((folder/'verification_v7.json').read_text())[0]
          meta=item['metadata']
          assert meta['backend']=='recorded instruments'
          assert item['audio_qa']['passed']
          assert meta['melody_answer']['changed']
          assert meta['melody_answer']['earlier_hook_unchanged']
          assert (folder/'after-v7-p5-answer.mp3').is_file()
          print('P5 recorded-instrument final cadence passed technical QA; preference not asserted.')
          PY
      - name: Verify optional P6 room pre-delay with recorded piano and guitar
        run: |
          python demo_v7.py --assets assets/v7 --style harbor --room-predelay-ms 32 --out v7-p6-harbor
          python - <<'PY'
          import json,pathlib
          out=pathlib.Path('v7-p6-harbor')
          r=json.loads((out/'verification_v7.json').read_text())[0]
          assert r['metadata']['backend']=='recorded instruments'
          assert r['metadata']['room_predelay_ms']==32
          assert r['audio_qa']['passed']
          assert (out/'harbor-v7-p6-room32ms.mp3').is_file()
          print('P6 optional room pre-delay rendered with original recorded samples; preference untested')
          PY
      - name: Verify P7 optional precise low-frequency mono on recorded instruments
        run: |
          python demo_v7.py --assets assets/v7 --style after --precise-low-mono --out v7-p7-after
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('v7-p7-after')
          result=json.loads((root/'verification_v7.json').read_text())[0]
          assert result['metadata']['backend']=='recorded instruments'
          assert result['metadata']['precise_low_mono'] is True
          assert result['audio_qa']['passed']
          assert (root/'after-v7-p7-mono.mp3').is_file()
          print('P7 optional center-preserving low-side filter passed recorded instrument QA')
          PY
      - name: Retain all three listening demos and provenance
        uses: actions/upload-artifact@v4
        with:
          name: Music-Studio-v7-Instrument-and-Effects-Demos
          path: |
            v7-demos/*.mp3
            v7-demos/*.score.json
            v7-demos/*.metadata.json
            v7-demos/verification_v7.json
            v7-demos/sample_coverage_p1.json
            v7-p2-harbor/verification_v7.json
            v7-p2-silver/verification_v7.json
            v7-p3-after/verification_v7.json
            v7-p3-drum-after/verification_v7.json
            v7-p4-silver/verification_v7.json
            v7-p5-after/verification_v7.json
            v7-p6-harbor/verification_v7.json
            v7-p7-after/verification_v7.json
            assets/v7/*provenance*.json
          retention-days: 90
      - name: Publish new release without rewriting older recordings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view music-studio-v7-instrument-fit >/dev/null 2>&1 || \
            gh release create music-studio-v7-instrument-fit \
              --title 'Music Studio v7 — Instrument Compatibility and Effects' \
              --notes 'Three new original ~35–41-second instrumental previews using actual CC0 recorded Meta Open Sound steel/nylon guitar and piano, FreePats finger/picked bass and clean electric guitar, and MuldjordKit acoustic drums (CC BY 4.0; recordings by DrumGizmo.org). Improvements: native bass range, compact guitar voicings, collision checks, staggered strumming, distinct instrument roles, tempo-synced delay, room sends, tremolo, chorus, kick-bass sidechain, low-frequency mono. Technical checks only; listener feedback is needed.'
          gh release upload music-studio-v7-instrument-fit \
              v7-demos/harbor-v7.mp3 v7-demos/after-v7.mp3 v7-demos/silver-v7.mp3 v7-demos/verification_v7.json --clobber
