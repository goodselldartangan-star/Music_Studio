name: Q4 sfizz offline SFZ probe — genuine pedal and release recordings

on:
  push:
    branches: [main]
    paths:
      - 'tools/probe_sfz_piano_q4.py'
      - 'tests/test_sfz_probe_q4.py'
      - 'tests/test_sfz_voice_lanes_q4.py'
      - 'studio7/sfz_pedal_routing.py'
      - 'tests/test_sfz_pedal_routing_q4.py'
      - 'tools/sfz_pedal_controller_q4.py'
      - 'tests/test_sfz_pedal_controller_q4.py'
      - 'tools/probe_pedal_once_q4.py'
      - 'tools/render_sfz_lanes_q4.py'
      - 'tests/test_render_sfz_lanes_q4.py'
      - 'studio7/sfz_voice_lanes.py'
      - '.github/workflows/q4-sfz-sampler-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-sample-sfz-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only conventional offline audio diagnostics
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Test deterministic same-note comparisons and source-identity contracts
        run: python -m unittest tests.test_sfz_probe_q4 tests.test_sfz_voice_lanes_q4 tests.test_render_sfz_lanes_q4 tests.test_sfz_pedal_routing_q4 tests.test_sfz_pedal_controller_q4 -v
      - name: Audit required instance pool against actual Silver score and opted-in pedal timing
        run: |
          mkdir -p q4-sfizz-probe
          python - <<'PY'
          import json
          from pathlib import Path
          from studio7.score import make
          from studio7.pedal_timing import shape_silver_pedal_timing
          from studio7.sfz_voice_lanes import assign_sfz_voice_lanes
          score=make('silver')
          pedal,_=shape_silver_pedal_timing(score)
          result={}
          for name,music in (('original',score),('pedal_timing',pedal)):
              piano=[n for n in music['notes'] if n['instrument']=='piano']
              groups,stats=assign_sfz_voice_lanes(piano,music['bpm'],max_instances=8)
              assert stats['input_notes']==sum(len(group) for group in groups)
              result[name]={
                  'piano_notes':stats['input_notes'],
                  'required_instances':stats['instance_count'],
                  'release_guard_s':stats['release_guard_s']
              }
          Path('q4-sfizz-probe/Q4_silver_instance_budget.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Download just five authentic CC BY 3.0 piano notes and noises, not the full library
        run: |
          mkdir -p q4-sfizz-probe/Samples
          COMMIT=3382bf9496bba2486f5ab0de55a264d1dfc38404
          for filename in C4v12.flac rel60.flac harmV3C4.flac pedalD1.flac pedalU1.flac; do
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/sfzinstruments/SalamanderGrandPiano/$COMMIT/Samples/$filename" \
              -o "q4-sfizz-probe/Samples/$filename"
          done
      - name: Verify every original publisher Git blob and generate fixed 4-second MIDI controls
        run: python -m tools.probe_sfz_piano_q4 prepare --out q4-sfizz-probe
      - name: Allocate two same-pitch re-plucks to independent sampler instances
        run: python -m tools.render_sfz_lanes_q4 prepare --out q4-sfizz-probe/lanes
      - name: Prepare one-pedal-only physical mechanism routing, without changing notes
        run: python -m tools.probe_pedal_once_q4 prepare --root q4-sfizz-probe
      - name: Install sfizz 1.2.3 offline renderer in isolated Alpine edge testing container
        run: |
          docker run --rm \
            -v "$PWD/q4-sfizz-probe:/work" -w /work alpine:edge sh -euc '
              echo "https://dl-cdn.alpinelinux.org/alpine/edge/testing" >> /etc/apk/repositories
              apk add --no-cache sfizz
              sfizz_render --help >/dev/null
              for midi in *.mid; do
                base="${midi%.mid}"
                prefix="${base%%_*}"
                echo "Rendering $midi using $prefix.sfz"
                sfizz_render --sfz "$prefix.sfz" --midi "$midi" \
                  --wav "$base.wav" -s 44100 --use-eot
              done
              for midi in lanes/lane_*.mid; do
                base="${midi%.mid}"
                echo "Independently rendering $base through its own SFZ instance"
                sfizz_render --sfz unlimited.sfz --midi "$midi" \
                  --wav "$base.wav" -s 44100 --use-eot
              done
              for midi in lanes/with_pedal_lane_*.mid; do
                base="${midi%.mid}"
                sfizz_render --sfz Q4_note_lane_pedal_gate.sfz --midi "$midi" \
                  --wav "$base.wav" -s 44100 --use-eot
              done
              for name in shared_pedal shared_pedal_muted; do
                sfizz_render --sfz lanes/shared_pedal.sfz \
                  --midi "lanes/$name.mid" --wav "lanes/$name.wav" \
                  -s 44100 --use-eot
              done
            '
      - name: Measure voice self-masking and true recorded release/CC64 layers
        run: |
          python -m tools.probe_sfz_piano_q4 inspect --out q4-sfizz-probe
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('q4-sfizz-probe/Q4_sfizz_feasibility_report.json').read_text())
          for variant,checks in report['voice_tests'].items():
              print(variant,checks)
          print('Release:',report['release_samples'])
          print('Pedal:',report['pedal_noise'])
          assert len(json.loads(Path('q4-sfizz-probe/source_identity.json').read_text())['samples'])==5
          assert report['release_samples']['key_release_layer_detected']
          assert report['release_samples']['string_resonance_layer_detected']
          assert report['pedal_noise']['pedal_mechanism_layer_detected']
          for mode,voice in report['voice_tests'].items():
              assert voice['louder_same_channel']['old_tail_rms']>1e-6
              assert 'post_short_noteoff_relative_error' in voice['louder_same_channel']
              if not voice['louder_same_channel']['independent_post_noteoff_tails']:
                  print('BLOCKER:',mode,'older voice is not independently preserved in one SFZ instance')
          PY
      - name: Verify genuinely independent sampler instances preserve old C4 through new note-off
        run: |
          python -m tools.render_sfz_lanes_q4 mix --out q4-sfizz-probe/lanes
          python - <<'PY'
          from pathlib import Path
          from tools.probe_sfz_piano_q4 import read_stereo, rms, _window
          root=Path('q4-sfizz-probe')
          isolated=read_stereo(root/'lanes/Q4_isolated_lane_mix.wav')
          reference=read_stereo(root/'Q4_independent_voice_reference.wav')
          old=read_stereo(root/'unlimited_old.wav')
          rel_error=rms(isolated-reference)/max(rms(reference),1e-10)
          post_tail=rms(_window(isolated,1.4,1.9))/max(rms(_window(old,1.4,1.9)),1e-10)
          print('Lane renderer relative error:',rel_error)
          print('Older C4 tail after shorter new note-off:',post_tail)
          assert rel_error<.02
          assert .8<post_tail<1.5
          PY
      - name: Verify original recorded pedal sound triggers once, never once per voice
        run: |
          python -m tools.probe_pedal_once_q4 inspect --root q4-sfizz-probe
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('q4-sfizz-probe/Q4_one_pedal_report.json').read_text())
          assert m['mechanism_instance_count']==1
          assert m['instance_count']==2
          assert m['note_lanes_still_sound']
          assert m['pedal_enabled_rms']>1e-6
          assert m['pedal_muted_rms']<1e-7
          assert m['single_mechanism_rms_difference_error']<.00001
          PY
      - name: Save only source provenance, measurements and short comparison MP3s
        if: always()
        run: |
          for variant in unlimited limited; do
            for name in old both_loud both_split; do
              src="q4-sfizz-probe/${variant}_${name}.wav"
              if test -f "$src"; then
                ffmpeg -nostdin -v error -y -i "$src" -c:a libmp3lame -b:a 192k \
                  "q4-sfizz-probe/Q4_${variant}_${name}.mp3"
              fi
            done
          done
          if test -f q4-sfizz-probe/Q4_one_pedal_mechanism_mix.wav; then
            ffmpeg -nostdin -v error -y \
              -i q4-sfizz-probe/Q4_one_pedal_mechanism_mix.wav \
              -c:a libmp3lame -b:a 192k \
              q4-sfizz-probe/Q4_one_shared_pedal_mechanism.mp3
          fi
          if test -f q4-sfizz-probe/lanes/Q4_isolated_lane_mix.wav; then
            ffmpeg -nostdin -v error -y \
              -i q4-sfizz-probe/lanes/Q4_isolated_lane_mix.wav \
              -c:a libmp3lame -b:a 192k \
              q4-sfizz-probe/Q4_independent_sfz_lane_mix.mp3
          fi
          if test -f q4-sfizz-probe/Q4_independent_voice_reference.wav; then
            ffmpeg -nostdin -v error -y \
              -i q4-sfizz-probe/Q4_independent_voice_reference.wav \
              -c:a libmp3lame -b:a 192k \
              q4-sfizz-probe/Q4_independent_voice_reference.mp3
          fi
      - name: Archive diagnostics and derived short waveforms, not licensed samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Q4-SFZ-Salamander-RealSample-Feasibility
          path: |
            q4-sfizz-probe/Q4_sfizz_feasibility_report.json
            q4-sfizz-probe/Q4_one_pedal_report.json
            q4-sfizz-probe/lanes/Q4_pedal_route_plan.json
            q4-sfizz-probe/source_identity.json
            q4-sfizz-probe/Q4_silver_instance_budget.json
            q4-sfizz-probe/lanes/Q4_lane_audio_report.json
            q4-sfizz-probe/lanes/Q4_lane_plan.json
            q4-sfizz-probe/Q4_*.mp3
          retention-days: 90
