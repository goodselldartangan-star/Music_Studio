name: P3 bass/kick pocket — isolated score and audio comparison

on:
  push:
    branches: [main]
    paths:
      - 'studio7/rhythm.py'
      - 'studio7/render.py'
      - 'demo_v7.py'
      - 'tests/test_rhythm_pocket_p3.py'
      - 'tools/compare_rhythm_p3.py'
      - '.github/workflows/rhythm-pocket-p3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pocket-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio test dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libfluidsynth3 timgm6mb-soundfont
      - name: Verify original score, P2 and new P3 constraints
        run: |
          python -m unittest tests.test_rhythm_audit_p3 tests.test_rhythm_pocket_p3 tests.test_piano_performance_p2 tests.test_bass_performance_p2 tests.test_playing_p2 tests.test_performance_combination_p2 tests.test_articulation -v
      - name: Render same-drum-stem timing A/B
        run: |
          python -m tools.compare_rhythm_p3 --gm /usr/share/sounds/sf2/TimGM6mb.sf2 --out p3-pocket-preview
          ffmpeg -v error -xerror -i p3-pocket-preview/P3_pocket_before.mp3 -f null -
          ffmpeg -v error -xerror -i p3-pocket-preview/P3_pocket_after.mp3 -f null -
      - name: Full arrangement opt-in check
        run: |
          python demo_v7.py --gm /usr/share/sounds/sf2/TimGM6mb.sf2 --style after --rhythm-pocket --out p3-integrated
          test -f p3-integrated/after-v7-p3-pocket.mp3
          test -f p3-integrated/verification_v7.json
      - name: Save technical timing comparisons
        uses: actions/upload-artifact@v4
        with:
          name: P3-Kick-Bass-Pocket-Technical-Comparison
          path: |
            p3-pocket-preview/P3_pocket_*.mp3
            p3-pocket-preview/P3_pocket_report.json
            p3-integrated/verification_v7.json
          retention-days: 90
